<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow"><title>Portfolio</title>
<style>
:root{color-scheme:light dark;--bg:#F3F4F1;--fg:#141B18;--muted:#5E6963;--line:#DDE1DC;--accent:#1F5F7A}
@media(prefers-color-scheme:dark){:root{--bg:#0F1412;--fg:#E7ECE9;--muted:#95A19B;--line:#2A332F;--accent:#6FB3CF}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:max(24px,env(safe-area-inset-top)) 20px 40px}
form{max-width:360px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
h1{font-size:18px;margin:0}p{margin:0;color:var(--muted);font-size:14px}
input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg)}
button{font:600 16px -apple-system,sans-serif;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff}
.err{color:#B23636;font-size:14px;min-height:1.2em}
</style></head><body>
<form id="f"><h1>Portfolio</h1><p>Enter your passphrase. This device will remember it.</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Passphrase" autofocus>
<button type="submit">Unlock</button><div class="err" id="err"></div></form>
<script>
const ITER=600000; let salt, iv, ct;
async function loadBlob(){
  const r=await fetch("blob.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("blob "+r.status);
  const raw=Uint8Array.from(atob((await r.json()).b),c=>c.charCodeAt(0));
  salt=raw.slice(0,16); iv=raw.slice(16,28); ct=raw.slice(28);
}
async function keyFrom(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,256);
  return crypto.subtle.importKey("raw",bits,"AES-GCM",false,["decrypt"]);
}
async function show(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
  const lock=document.createElement("p");lock.style.cssText="text-align:center;font-size:12px;margin:24px 0 0";
  lock.innerHTML='<a href="#" id="lock" style="color:inherit;opacity:.6">Lock this device</a>';
  document.body.appendChild(lock);
  const loadedAt=Date.now();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && Date.now()-loadedAt>5*60*1000) location.reload(); });
  document.getElementById("lock").onclick=e=>{e.preventDefault();try{localStorage.removeItem("pfpw")}catch(_){}location.reload();};
}
async function tryPw(pw){
  try{ await show(await keyFrom(pw)); try{localStorage.setItem("pfpw",pw)}catch(_){} return true; }catch(e){ return false; }
}
(async()=>{
  try{ await loadBlob(); }catch(e){ document.getElementById("err").textContent="Couldn't load the latest page — check your connection and pull to refresh."; return; }
  let saved=null; try{saved=localStorage.getItem("pfpw")}catch(_){}
  if(saved && await tryPw(saved)) return;
  document.getElementById("f").onsubmit=async e=>{e.preventDefault();
    const pw=document.getElementById("pw").value; document.getElementById("err").textContent="";
    if(!(await tryPw(pw))) document.getElementById("err").textContent="That passphrase didn't unlock the page.";};
})();
</script></body></html>

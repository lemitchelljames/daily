const raw=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0));
const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
async function keyFrom(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,256);
  return crypto.subtle.importKey("raw",bits,"AES-GCM",false,["decrypt"]);
}
async function show(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
  const lock=document.createElement("p");lock.style.cssText="text-align:center;font-size:12px;margin:24px 0 0";
  lock.innerHTML='<a href="#" id="lock" style="color:inherit;opacity:.6">Lock this device</a>';
  document.body.appendChild(lock);
  document.getElementById("lock").onclick=e=>{e.preventDefault();try{localStorage.removeItem("pfpw")}catch(_){}location.reload();};
}
async function tryPw(pw){
  try{ await show(await keyFrom(pw)); try{localStorage.setItem("pfpw",pw)}catch(_){} return true; }catch(e){ return false; }
}
(async()=>{
  let saved=null; try{saved=localStorage.getItem("pfpw")}catch(_){}
  if(saved && await tryPw(saved)) return;
  document.getElementById("f").onsubmit=async e=>{e.preventDefault();
    const pw=document.getElementById("pw").value; document.getElementById("err").textContent="";
    if(!(await tryPw(pw))) document.getElementById("err").textContent="That passphrase didn't unlock the page.";};
})();
